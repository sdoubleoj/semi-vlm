# 본 학습 LoRA (GPU 1~2장 DDP)
model_path: models/qwen3-vl-4b-thinking
train_jsonl: data/sft/v1_think/train.jsonl
val_jsonl: data/sft/v1_think/val.jsonl
output_dir: outputs/lora_4b
run_name: lora_4b

lora: { r: 64, alpha: 128, dropout: 0.05 }
freeze_vision: true

per_device_batch: 16
grad_accum: 2
lr: 1.0e-4
epochs: 2
max_length: 4096
num_workers: 6
gradient_checkpointing: false
eval_steps: 500
save_steps: 500
report_to: wandb
